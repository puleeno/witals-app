<div class="grid">

    {menutab}

    <div class="c20"></div>
    <script type="text/javascript" src="{dir_path}/highslide/highslide-with-gallery.js"></script>
    <link rel="stylesheet" type="text/css" href="{dir_path}/highslide/highslide.css" />
    <script type="text/javascript">
        hs.graphicsDir = '{dir_path}/highslide/graphics/';
        hs.align = 'center';
        hs.transitions = ['expand', 'crossfade'];
        hs.fadeInOut = true;
        hs.outlineType = 'rounded-white';
        hs.wrapperClassName = 'white';
        hs.captionEval = 'this.a.title';
        hs.numberPosition = 'caption';
        hs.useBox = true;
        hs.width = 600;
        hs.height = 400;
        hs.dimmingOpacity = 0.8;


        hs.addSlideshow({
            //slideshowGroup: 'group1',
            interval: 5000,
            repeat: false,
            useControls: true,
            overlayOptions: {
                className: 'text-controls',
                position: 'bottom center',
                relativeTo: 'viewport',
                offsetY: -60
            },
            thumbstrip: {
                position: 'bottom center',
                mode: 'horizontal',
                relativeTo: 'viewport'
            }
        });
    </script>


    <h1 class="title-page">{catname}</h1>

    <div class="c10"></div>
    <div>{catcontent}</div>
    <!-- START BLOCK : album -->
    <div class="flex-container flex-space-between"> 
        <!-- START BLOCK : listAlbum -->
        <div class="cell-1-3 mobile-col-1-1 tab-cell-1-2 pad-cell-1-3  margin-bottom-20" >
            <div class="album-box">
                <a  href="{link}">{image}</a> 

                <div class="image-photo"></div>
                <div class="box-img"></div>
            </div>
            <div class="c10"></div>
            <h2 class="product-name"><a href="{link}">{name}</a></h2>
        </div>
        <!-- END BLOCK : listAlbum --> 
        <div class="cell-1-3"></div>
        
        
    </div>
    <div class="c"></div>
    <div class="paging">{pages}</div>
    <!-- END BLOCK : album --> 

    <!-- START BLOCK : photocell -->
    <link rel="stylesheet" type="text/css" href="{dir_path}/css/flexslider.css">
    <script src="{dir_path}/js/jquery.flexslider.js"></script>
    <div style="max-width:690px; margin:0 auto" id="photobox">

        <section class="slider">
            <div id="slider" class="flexslider" style="border:solid 1px #d6d6d6">
                <ul class="slides">
                    <!-- START BLOCK : cellPhoto -->
                    <li>
                        {image}
                    </li>
                    <!-- END BLOCK : cellPhoto -->     

                </ul>
            </div>
            <div class="c20"></div>

            <div>
                <div class="custom-navigation1">
                    <a href="#" class="flex-prev"></a>
                    <div class="custom-controls-container1"></div>
                    <a href="#" class="flex-next"></a>

                    <div id="carousel" class="flexslider">
                        <ul class="slides">
                            {thumb}
                        </ul>
                    </div>
                </div>
            </div>
        </section>
        <script type="text/javascript">

            $(window).load(function () {
                $('#carousel').flexslider({
                    animation: "slide",
                    controlNav: false,
                    animationLoop: false,
                    slideshow: false,
                    itemWidth: 256,
                    itemMargin: 10,
                    asNavFor: '#slider',
                    controlNav: false,
                            controlsContainer: $(".custom-controls-container1"),
                    customDirectionNav: $(".custom-navigation1 a"),
                    breakpoints: {
                        320: {
                            itemWidth: 100,
                        },
                        480: {
                            itemWidth: 120,
                        },
                        640: {
                            itemWidth: 150,
                        }}
                });

                $('#slider').flexslider({
                    animation: "slide",
                    controlNav: false,
                    animationLoop: false,
                    slideshow: false,
                    sync: "#carousel",
                    start: function (slider) {
                        $('body').removeClass('loading');
                    },
                });
            });
        </script>

    </div>
    <!-- END BLOCK : photocell -->
    <!-- START BLOCK : photocell1 -->
    <div class="row-1 "> 
        <!-- START BLOCK : cellPhoto1 -->
        <div class="col-1-3 photo-col-1-3 mobile-col-1-1 tab-col-1-2" >
            <div class="border-photo-gallery"><a onclick="return hs.expand(this, {slideshowGroup: 'second-group'})" href="{bigimage}">{image}</a></div>
            <h2 class="product-name"><a  href="{link}">{name}</a></h2>
        </div>
        {mobile-break}{tab-break}{pad-break}{pc-break}
        <!-- END BLOCK : cellPhoto1 -->
        <div class="c10"></div>
    </div>

    <div class="c5"></div>
    <div class="paging">{pages}</div>
    <!-- END BLOCK : photocell1 --> 


</div>
