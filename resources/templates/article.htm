{slideshow}

<div class="c5"></div>
{pathpage}

<div class="content-detail">
    
	<div class="grid" >
	
	
	
	
		<!-- START BLOCK : newsCat -->	


			<div class="c20"></div>
			<div>{cat_content}</div>


		<!-- START BLOCK : news_list -->
		 <div class="item-news">
			<div class="cell-1-5 mobile-cell-1-1" style="padding-right: 10px;"><a href="{link_detail}">{image}</a></div>
			<div class="cell-4-5 mobile-cell-1-1">
				<h2 class="news-name"><a href="{link_detail}">{author_name}</a></h2>
				<div>{author_info}</div>
				<div class="intro-service hide-on-mobile" style="padding-top:5px;" align="justify">{intro}</div>
			</div>
			<div class="c10"></div>
		</div>
		<div class="c10"></div>
		<!-- END BLOCK : news_list --> 
		<div class="c10"></div>
		<div class="paging">{pages}</div>
		<!-- END BLOCK : newsCat -->
		
		
		<!-- START BLOCK : newsDetail --> 

			<div class="c10"></div>
			<h1 class="news-name-detail">{author_name}</h1>
			<div>{author_info}</div>
			<h2 class="intro-detail" style="font-style: italic;">{intro}</h2>
			<div class="content-detail" style="font-style: italic;">{content}</div>
			<div class="c10"></div>
			<!-- AddThis Button BEGIN -->
			<div class="addthis_toolbox addthis_default_style ">
				<a class="addthis_button_facebook_like" fb:like:layout="button_count"></a>
				<a class="addthis_button_tweet"></a>
				<a class="addthis_button_google_plusone" g:plusone:size="medium"></a> 
				<a class="addthis_counter addthis_pill_style"></a>

			</div>
			<!-- AddThis Button END -->
			<div class="c20"></div>
		   <div style="border-bottom:solid 1px #CCC; line-height:25px;">
				<strong>Các ý kiến khác:</strong>
			</div>
			<div class="c5"></div>
			<ul class="other-article">
				<!-- START BLOCK : newsest -->
				<li><a href="{link_detail}">{author_name} - {author_info}</a></li>
				<!-- END BLOCK : newsest --> 
				<!-- START BLOCK : newsold_list -->
				<li><a href="{link_detail}">{author_name} - {author_info}</a></li>
				<!-- END BLOCK : newsold_list --> 
			</ul>

		<!-- END BLOCK : newsDetail --> 
		
		<div class="c20"></div>
	
	</div>
	
</div>
<div class="c20"></div>
