<style>
    .flashsale-header {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .flashsale-header h2 {
        margin: 0;
    }
</style>

<!-- START BLOCK : product -->
<div class="flashsale-wrapper">
    <div class="c50"></div>

    <div class="grid">

        <div class="homecat-title">

            <div class="flashsale-header">
                <img class="flas-sales" src="{catimage}" width="80" alt="">
                <h2><a href="{link}">{catname}</a></h2>
                <div class="flashsale-timer">
                    <div class="countdown"></div>
                </div>
            </div>

        </div>
        <div class="c30"></div>
        <div class="flex-container">

            <!-- START BLOCK : product_item -->
            <div class="cell-1-4 tab-cell-1-2">

                <div class="producthome-item">
                    <div class="img-hv">
                        <a href="{link_detail}" class="img-shine" title="{name}">
                            {image}
                        </a>
                        <a class="addcart" href="{link_cart}" title="Thêm vào giỏ hàng"><i class="fas fa-cart-plus"></i></a>
                    </div>

                    <div class="producthot-box">
                        <h3>
                            <a href="{link_detail}" class="producthot-item__name text-line-2" title="{name}">
                                {name}
                            </a>
                        </h3>
                        <div class="c10"></div>
                        <div class="producthot__price">
                            <span class="producthot__price-old">{pricekm}</span>
                            <span class="producthot__price-current">{price}</span>
                        </div>
                    </div>

                    <div class="c10"></div>
                    {sale_off}
                </div>

            </div>
            <!-- END BLOCK : product_item -->

        </div>
        <div class="c30"></div>
        <div class="text-center">
            <a href="{link}" class="btn-seeall">Xem Tất cả</a>
        </div>
        <div class="c30"></div>
    </div>

    <div class="c20"></div>
</div>
<!-- END BLOCK : product -->

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const countdownElements = document.querySelectorAll('.countdown');
        const now = Date.now();

        let endTime = localStorage.getItem('flashsale_endTime');
        if (!endTime) {
            endTime = now + 4 * 60 * 60 * 1000;
            localStorage.setItem('flashsale_endTime', endTime);
        } else {
            endTime = parseInt(endTime);
        }

        countdownElements.forEach((el, index) => {
            if (index === 0) {
                function updateCountdown() {
                    const current = Date.now();
                    const distance = endTime - current;

                    if (distance < 0) {
                        endTime = Date.now() + 4 * 60 * 60 * 1000;
                        localStorage.setItem('flashsale_endTime', endTime);
                    } else {
                        const hours = String(Math.floor(distance / (1000 * 60 * 60))).padStart(2, '0');
                        const minutes = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                        const seconds = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
                        el.innerHTML = hours + ":" + minutes + ":" + seconds;
                    }
                }
                updateCountdown();
                setInterval(updateCountdown, 1000);
            } else {
                el.style.display = 'none';
            }
        });
    });
</script>

<!-- START BLOCK : news -->
<div class="servicehome-wrapper" style="background-color: #3b3b3b0a;">
    <div class="c50"></div>

    <div class="grid">

        <h2 class="homecat-title homecat-title__service">
            <a href="{link}">{catname}</a>
        </h2>

        <div class="c30"></div>

    </div>
    <div class="swiper-container slider-homenews">
        <div class="swiper-wrapper">
            <!-- START BLOCK : news_item -->
            <div class="swiper-slide">
                <div class="service-item">
                    <a href="{link_detail}" class="">
                        {image}
                    </a>
                    <div class="service-item__content">
                        <h3 class="service-item__name">
                            <a href="{link_detail}" class="text-line-2">
                                {name}
                            </a>
                        </h3>

                        <div class="text-line-3">
                            {intro}
                        </div>
                    </div>
                </div>
            </div>
            <!-- END BLOCK : news_item -->
        </div>
        <div class="service-button-next"><i class="fas fa-chevron-right"></i></div>
        <div class="service-button-prev"><i class="fas fa-chevron-left"></i></div>
    </div>

    <div class="c30"></div>
    <div class="c50"></div>
</div>
<script>
    $(function () {
        var slide_homenews = new Swiper(".slider-homenews", {
            loop: true,
            slidesPerView: 4,
            spaceBetween: 20,
            autoplay: {
                delay: 2000,
            },
            pagination: {
                clickable: true,
            },
            navigation: {
                nextEl: '.service-button-next',
                prevEl: '.service-button-prev'
            },
            breakpoints: {
                320: {
                    slidesPerView: 1,
                    spaceBetween: 20
                },
                768: {
                    slidesPerView: 2.5,
                    spaceBetween: 30
                },
                1024: {
                    slidesPerView: 3,
                    spaceBetween: 20
                }
            }
        });
    });
</script>
<!-- END BLOCK : news -->
