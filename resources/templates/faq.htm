<div class="row">
  <div class="col-1-1 mobile-col-1-1 tab-col-1-1 pad-col-1-1">
	<div class="crumb"><a href="/{lang_dir}">{_home}</a> <i class="fa fa-angle-right"></i> {pathpage}</div>
</div>
</div>
<div class="c20"></div>
<div class="pad-padding-right-10 tab-padding-left-10">
<h1 class="page-name"><a href="{link}">{catname}</a></h1>
<div class="c20"></div>
<div > 
  <!-- START BLOCK : listanswer -->
  <div class="faq-item"  id="{id}">
    <h2 class="toggle name-faq">"{name}"</h2>
    <div class="c5"></div>
  </div>
  <div class="content faqcontent" id="faq_{id}">
    <div class="c5"></div>
    <div id="div{id}"><i class="icon icon-a">a</i>{content}</div>
    <div class="c10"></div>
  </div>
  <div class="c30"></div>
  <!-- END BLOCK : listanswer -->
  <div class="c5"></div>
  <div class="linegray"></div>
  <div class="paging">{pages}</div>
</div>
<script>
	$(function(){
		$('.faq-item').click(function(){
			$('.faqcontent').hide();
			$('#faq_' + $(this).attr('id')).stop().slideToggle();
		});
	});
</script> 
</div>
