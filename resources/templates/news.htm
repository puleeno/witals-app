<!-- START BLOCK : newsHot -->
	<div class="news-home-wrapper">

		<div class="c10"></div>
		<div class="grid">


			
			<h1 class="title-page"><span>{catname}</span></h1>
			
			
			<div class="c5"></div>
			<div class="c10"></div>
			<div class="cat-content">{catintro} </div>
			<div class="c10"></div>


			<div style="position: relative;">
				<div class="c20"></div>
				<div class="news-next btn-next"> <img src="/images/btn-next.png"/> </div>
				<div class="news-prev btn-prev"> <img src="/images/btn-prev.png"/> </div>

				<div class="swiper-container" id="newsHome">
					<div class="swiper-wrapper">
						<!-- START BLOCK : newsHotItem -->
						<div class="swiper-slide"> 
							<a href="{link_detail}">{image}</a>
							<div class="c5"></div>
							<h3 class="news-home-name"> <a href="{link_detail}">{name}</a> </h3>
							<div class="c10"></div>
							<div class="news-home-intro text-line-3 hide-on-mobile" >{intro}</div>

						</div>
						<!-- END BLOCK : newsHotItem --> 
					</div>
				</div>
			</div>


			<script>
				var swiper_news = new Swiper('#newsHome', {
					slidesPerView: 3,
					autoplay: {
						delay: 2200,
						disableOnInteraction: false,
					},
					spaceBetween: 20,
					navigation: {
						nextEl: '.news-next',
						prevEl: '.news-prev',
					},
					speed: 400,
					loop: true,
					breakpoints: {
						768: {
							slidesPerView: 2,
							spaceBetween: 30
						}
					}
				});
				$('#newsHome').on('mouseover', function () {
					swiper_news.autoplay.stop();
				});
				$('#newsHome').on('mouseout', function () {
					swiper_news.autoplay.start();
				});
			</script>     




		</div>
		<div class="c10"></div>

	</div>
	<!-- START BLOCK : newsHot -->

					{
					  "@context": "https://schema.org",
					  "@type": "NewsArticle",
					  "mainEntityOfPage": {
						"@type": "WebPage",
						"@id": "{site_address}{link_detail}"
					  },
					  "headline": "{name}",
					  "image": [
						"{site_address}{image}"
					   ],

					  "dateModified": "{createdate}",

						"@type": "Person",
						"name": "Admin"

						"logo": {
