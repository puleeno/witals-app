<!-- START BLOCK : support_item111  -->
<h2 class="title-left">{_online_support}</h2>
<div class="box-left">
	
	<div class="support-item">
		<div class="support-name">{name} </div>
		<div class="c5"></div>
		<div style="text-align: center;">
			<a href="skype:{sky}?chat" title="{name}">
				<img src="/images/skype-icon.png"/>
			</a>
		</div>
		<div>Email: {nic} </div>
		<div>Phone: {phone} </div>
	</div>
	
</div>

<!-- END BLOCK : support_item111  -->

<!-- START BLOCK : advRight -->
<div class="fixed-right hide-on-tab hide-on-mobile">
<div class="c10"></div>

<!-- START BLOCK : advRightSlide  -->
<div class="qc-right">{image}</div>
<!-- END BLOCK : advRightSlide  -->
<script>

	$(window).scroll(function (event) {
	
		var fixfooter = $('.footer').position();
        if ( ($(this).scrollTop() > 150)) {
		
			if (($(this).scrollTop() < (fixfooter.top - $('.fixed-right').height()) )){
				$('.fixed-right').css({'position': 'fixed', 'top': '0px', 'z-index': '9999', 'width': '282px'});
			}else{
				$('.fixed-right').css( { 'position' : 'absolute', 'top' :'','bottom' : '0px'} );	
			}

            
        } else {
            $('.fixed-right').css({'position': 'relative', 'top': '0px', 'z-index': '9999', 'width': '100%' });
        }
    });

</script>

</div>
<!-- END BLOCK : advRight -->
